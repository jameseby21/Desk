[project]
name = "desk"
version = "0.1.0"
description = "Desk: tickets as markdown files in your own git repo. A CLI for agents, a small web UI for the owner. Done means proof."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JA Insights LLC" }]
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
desk = "desk.cli:main"
desk-ui = "desk.ui.app:main"
drew = "desk.cli:main"
drew-ui = "desk.ui.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
