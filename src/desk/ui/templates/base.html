<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/desk.css">
<link rel="icon" href="data:image/svg+xml,{{ favicon }}">
</head>
<body>
<header>
  <a class="mark" href="/"><i></i>Desk</a>
  <nav><a href="/">Today</a><a href="/board">Board</a><a href="/projects">Projects</a><a href="/about">About</a><a href="/settings">Settings</a></nav>
  <span class="home">{{ home }} · owner {{ owner }}</span>
</header>
<main>
{% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
<footer><a href="/about">About Desk: why it counts proof</a> · <span class="build">{{ build }}</span></footer>
<script>
document.addEventListener("submit", function (e) {
  var f = e.target;
  if (!f.classList || !f.classList.contains("post-once")) return;
  if (f.getAttribute("data-sending")) { e.preventDefault(); return; }  // a second click while the request is out does nothing
  f.setAttribute("data-sending", "1");
  f.classList.add("sending");
  setTimeout(function () {
    f.querySelectorAll("button[type=submit],input[type=submit]").forEach(function (b) {
      b.disabled = true;
      if (b.tagName === "BUTTON") { b.setAttribute("data-label", b.textContent); b.textContent = f.classList.contains("chk") ? "..." : "Sending..."; }
    });
  }, 0);
});
window.addEventListener("pageshow", function () {
  document.querySelectorAll("form.post-once").forEach(function (f) {
    f.removeAttribute("data-sending"); f.classList.remove("sending");
    f.querySelectorAll("button[type=submit]").forEach(function (b) { b.disabled = false; if (b.hasAttribute("data-label")) { b.textContent = b.getAttribute("data-label"); } });
  });
});
</script>
</body>
</html>
